services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    volumes:
      # Maps your local ./authelia folder to the container's config folder
      - ./authelia:/config
    expose:
      # Authelia communicates internally on 9091.
      # It is exposed to the Docker network so your reverse proxy can reach it.
      - 9091
    environment:
      - TZ=Europe/Belgrade # Adjust to your timezone