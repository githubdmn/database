services:
  mysql:
    env_file:
      - .env
    image: mysql:lts
    container_name: learning_mysql
    restart: always
    ports:
      - ${MYSQL_PORT}:${MYSQL_PORT_EXTERN}
    expose:
      - ${MYSQL_PORT_EXTERN}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-db:/var/lib/mysql
      #- ./scripts:/home/scripts:ro
      - ./scripts/01_learning_mysql:/scripts:ro
    user: "999:999"
  postgres:
    env_file:
      - .env
    image: postgres:latest
    container_name: learning_postgres
    restart: always
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT_EXTERN}
    expose:
      - ${POSTGRES_PORT_EXTERN}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_ROOT_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
    volumes:
      - postgres-db:/var/lib/postgresql/data
      - ./scripts/postgres:/scripts:ro
    user: "999:999"
  mongodb:
    env_file:
      - .env
    image: mongo:latest
    container_name: learning_mongodb
    restart: always
    ports:
      - ${MONGODB_PORT}:${MONGODB_PORT_EXTERN}
    expose:
      - ${MONGODB_PORT_EXTERN}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongodb-data:/data/db
      - ./scripts/mongodb:/scripts:ro
    user: "999:999"
  redis:
    env_file:
      - .env
    image: redis:alpine
    container_name: learning_redis
    restart: always
    ports:
      - ${REDIS_PORT}:${REDIS_PORT_EXTERN}
    expose:
      - ${REDIS_PORT_EXTERN}
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD}
      - --appendonly yes  # Enable persistence
      - --maxmemory 256mb # Set memory limit
      - --maxmemory-policy allkeys-lru # Eviction policy
    volumes:
      - redis-data:/data
      - ./scripts/redis:/scripts:ro
    user: "999:999"
volumes:
  mysql-db:
  postgres-db:
  mongodb-data:
  redis-data:
